        - 15_document_control/tests/test_document_control.py::test_the_model_path_accepts_only_a_reply_that_fits_the_schema

  - id: APP-04
    domain: Application
    title: "Tests run offline, and every control has a positive control"
    statement: "Every suite runs with no API key. A test that proves something never happens is paired with a run where it does (the control), so a zero means the check works, not that it is blind."
    rationale: "A zero without a control is indistinguishable from a broken test."
    adr: ["0013"]
    applies_to: ["06", "07", "08", "09", "10", "11", "12", "13", "14", "15"]
    evidence:
      "06":
