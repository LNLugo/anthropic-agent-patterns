# Architecture standards. The source of truth: standards.md is rendered from this
# file (python docs/architecture/render_standards.py), and a test fails if it is stale.
#
# Every standard names the tests that enforce it, as path::test. A test checks that
# each one exists, so a standard cannot cite enforcement that is not there. A
# standard enforced only by review says so (enforced_by: []), and is counted that way.
# applies_to lists the modules the standard governs; an exception (exceptions.yaml)
# records where one does not yet meet it.

standards:

  # ---------------------------------------------------------------- AI

  - id: AI-01
    domain: AI
    title: "The simplest pattern that reliably works"
    statement: "Start with the least autonomous pattern that solves the problem, and add a model or a loop only when a measurement shows the simpler one falls short."
    rationale: "Every added step is cost and a way to be wrong. The repo's routing, triage and evaluations are each justified by a number."
    adr: ["0001", "0011"]
    applies_to: ["06", "08", "12"]
    enforced_by: []

  - id: AI-02
    domain: AI
    title: "A model never writes queries"
    statement: "A model produces typed, validated arguments; the tool builds the query. No free text from a model reaches a query language."
    rationale: "Typed arguments leave nothing to inject into."
    adr: ["0002"]
    applies_to: ["08"]
    enforced_by:
      - 08_tools/tests/test_jql_tool.py::test_injection_through_a_field_is_rejected
      - 08_tools/tests/test_jql_tool.py::test_raw_jql_argument_cannot_pass_through
      - 08_tools/tests/test_jql_tool.py::test_jql_is_built_by_the_tool

  - id: AI-03
    domain: AI
    title: "Every run ends in a typed outcome"
    statement: "An agent turn ends in exactly one typed outcome, and a run always states why it ended. A reply outside the allowed set stops the run; it is never guessed at."
    rationale: "An agent that cannot say why it stopped cannot be audited or debugged."
    adr: []
    applies_to: ["06", "08"]
    enforced_by:
      - 06_agents/test_agents_06_v3_1.py::test_anything_else_is_an_interruption_not_a_guess
      - 06_agents/test_agents_06_v3_1.py::test_every_run_ends_with_a_status
      - 08_tools/tests/test_assistant_model_router.py::test_a_reply_with_no_tool_call_is_not_guessed_at

  - id: AI-04
    domain: AI
    title: "Answers are grounded or withheld"
    statement: "An answer ships only with evidence that resolves to what the model was shown (a citation, or the words that named the query's scope); otherwise the system abstains or asks."
    rationale: "A confident wrong answer is the expensive failure."
    adr: []
    applies_to: ["07", "08"]
    enforced_by:
      - 07_rag/tests/test_citations_and_graph.py::test_graph_abstains_when_citation_is_fabricated
      - 08_tools/tests/test_assistant_model_router.py::test_the_coverage_check_stops_a_half_answer_in_the_main_path
      - 08_tools/tests/test_assistant.py::test_missing_project_asks_a_question_and_runs_nothing

  - id: AI-05
    domain: AI
    title: "Guardrails return one of three behaviours, in a defined order"
    statement: "A tool guardrail allows, rejects with a message the model can act on, or halts the run. Security checks run first and halt; deployment policy coaches."
    rationale: "A security event must not be politely redirected into a retry."
    adr: ["0004"]
    applies_to: ["08", "12"]
    enforced_by:
      - 08_tools/tests/test_guardrails.py::test_order_matters_restricted_halts_before_scope_could_redirect
      - 08_tools/tests/test_assistant_model_router.py::test_raise_exception_halts_the_graph_even_for_a_call_the_bound_refuses
      - 12_integration/tests/test_triage.py::test_an_event_cannot_point_the_service_at_a_restricted_project

  - id: AI-06
    domain: AI
    title: "A write waits for a person who is not the requester"
    statement: "Any action that changes data pauses for approval, survives a restart while waiting, and cannot be approved by the identity that asked for it. No agent-facing interface can approve."
    rationale: "Accountability for a change belongs to a person."
    adr: ["0005"]
    applies_to: ["08", "12"]
    enforced_by:
      - 08_tools/tests/test_approval.py::test_the_requester_cannot_approve_their_own_write
      - 08_tools/tests/test_approval.py::test_resume_from_a_saved_checkpoint_after_a_restart
      - 08_tools/tests/test_mcp_server.py::test_a_comment_over_mcp_waits_for_a_person_and_there_is_no_approve_tool
      - 12_integration/tests/test_triage.py::test_the_service_cannot_approve_itself_and_a_person_posts_it_once

  - id: AI-07
    domain: AI
    title: "Measured on questions nobody tuned for"
    statement: "A model-dependent component is measured on a held-out set written without seeing the prompt, over more than one run, against a non-model baseline."
    rationale: "A score on the development set measures the prompt's fit to it."
    adr: ["0001", "0013"]
    applies_to: ["07", "08"]
    enforced_by:
      - 08_tools/tests/test_model_router.py::test_template_placeholders_are_refused
      - 11_finops/tests/test_cost_per_correct.py::test_rules_are_free_but_each_extra_correct_route_has_a_price

  # ---------------------------------------------------------------- Security and identity (application)

  - id: APP-01
    domain: Application
    title: "Every call is made as a named identity"
    statement: "Every call to a system of record names the user it acts for, or a service identity for work no person started. Permissions are the system's own, never replicated into the agent."
    rationale: "Delegated permissions cannot drift; a replicated copy can."
    adr: ["0003", "0012"]
    applies_to: ["07", "08", "12"]
    enforced_by:
      - 08_tools/tests/test_jql_tool.py::test_jira_refuses_calls_without_a_named_user
      - 08_tools/tests/test_jql_tool.py::test_count_depends_on_who_asks
      - 07_rag/tests/test_permissions.py::test_zero_leakage_with_filter
      - 12_integration/tests/test_gateway.py::test_jira_permissions_still_apply_through_the_gateway

  - id: APP-02
    domain: Application
    title: "Identity comes from the credential, never from the arguments"
    statement: "Who is asking is taken from a verified token. No tool or route accepts a user, caller or group argument."
    rationale: "An agent that can name the user can name any user."
    adr: ["0006"]
    applies_to: ["08", "12"]
    enforced_by:
      - 08_tools/tests/test_mcp_server.py::test_no_tool_takes_a_user_argument
      - 08_tools/tests/test_mcp_server.py::test_naming_another_user_in_the_arguments_changes_nothing
      - 12_integration/tests/test_gateway.py::test_the_contract_refuses_a_request_before_any_agent_runs

  - id: APP-03
    domain: Application
    title: "Fail closed"
    statement: "Unknown permissions, missing ancestors, unpriced models and unverifiable inputs are refused, not defaulted to open."
    rationale: "Every default-open path is a leak waiting for its input."
    adr: ["0008"]
    applies_to: ["07", "11", "12"]
    enforced_by:
      - 07_rag/tests/test_permissions.py::test_unknown_space_fails_closed
      - 07_rag/tests/test_permissions.py::test_chunk_without_gates_is_never_returned
      - 11_finops/tests/test_budget.py::test_an_unpriced_model_is_refused_before_it_is_called
      - 12_integration/tests/test_adapters.py::test_an_unsigned_or_forged_webhook_is_refused

  - id: APP-04
    domain: Application
    title: "Tests run offline, and every control has a positive control"
    statement: "Every suite runs with no API key. A test that proves something never happens is paired with a run where it does (the control), so a zero means the check works, not that it is blind."
    rationale: "A zero without a control is indistinguishable from a broken test."
    adr: ["0013"]
    applies_to: ["06", "07", "08", "10", "11", "12"]
    enforced_by:
      - tests/test_scripted_model.py::test_a_call_with_no_step_left_raises
      - 07_rag/tests/test_permissions.py::test_unfiltered_baseline_leaks
      - 10_observability/tests/test_leak_check.py::test_no_content_reaches_the_trace_file_and_the_control_sees_all_of_it
      - 12_integration/tests/test_integration_check.py::test_without_the_marker_one_lost_response_posts_twice

  - id: APP-05
    domain: Application
    title: "One way to choose a model"
    statement: "Modules get their model through llm_provider.get_chat_model, so the provider and model are one run setting."
    rationale: "Two selection paths drift: change the default in one and the other keeps the old one."
    adr: []
    applies_to: ["01", "02", "03", "04", "05", "06", "07", "08"]
    enforced_by: []

  # ---------------------------------------------------------------- Observability and cost (AI operations)

  - id: OPS-01
    domain: AI
    title: "Every run is traced, and content stays out by default"
    statement: "Every agent run is one trace with typed spans. Prompts, documents, model output and tool results are recorded only when explicitly enabled; metadata holds only identities, counts and values checked against a known format."
    rationale: "Traces are read by more people than the data they describe."
    adr: ["0007"]
    applies_to: ["06", "07", "08", "12"]
    enforced_by:
      - 10_observability/tests/test_leak_check.py::test_no_content_reaches_the_trace_file_and_the_control_sees_all_of_it
      - 08_tools/tests/test_guardrails.py::test_output_info_never_echoes_free_text_from_the_model
      - 08_tools/tests/test_traces.py::test_a_count_reconciles_span_for_span

  - id: OPS-02
    domain: AI
    title: "Costs come from a sourced price file"
    statement: "Every price has a source and a date. A cost that includes an unpriced model is reported as unpriced, never as zero or a partial sum."
    rationale: "A wrong number that looks real is worse than a missing one."
    adr: ["0008"]
    applies_to: ["07", "08", "11"]
    enforced_by:
      - 11_finops/tests/test_prices_and_costing.py::test_a_model_missing_from_the_file_is_refused
      - 11_finops/tests/test_prices_and_costing.py::test_one_unpriced_call_makes_the_run_and_every_total_unpriced
      - 11_finops/tests/test_cost_per_correct.py::test_the_price_file_reproduces_every_cost_recorded_in_08

  - id: OPS-03
    domain: AI
    title: "Model spend is held to a budget before the call"
    statement: "Every model call on behalf of an identity is checked against that identity's budget first, with a reserve for the call itself, so spend never passes the limit."
    rationale: "A budget reported after the fact is a bill, not a control."
    adr: ["0009"]
    applies_to: ["06", "07", "08", "12"]
    enforced_by:
      - 11_finops/tests/test_budget.py::test_a_daily_budget_stops_at_the_expected_question_and_calls_nothing_after
      - 11_finops/tests/test_budget.py::test_a_budget_stops_a_runaway_loop_mid_run
      - 12_integration/tests/test_gateway.py::test_the_model_route_is_held_to_the_callers_budget

  # ---------------------------------------------------------------- API

  - id: API-01
    domain: API
    title: "Every external interface is behind the gateway"
    statement: "Clients reach agents through one gateway that applies identity, scopes, rate limits, the contract and budgets in a fixed order."
    rationale: "One policy point is one place to audit and change."
    adr: []
    applies_to: ["08", "12"]
    enforced_by:
      - 12_integration/tests/test_gateway.py::test_no_token_no_entry
      - 12_integration/tests/test_gateway.py::test_a_route_needs_its_scope
      - 12_integration/tests/test_gateway.py::test_a_burst_is_limited_per_subject_and_recovers

  - id: API-02
    domain: API
    title: "The contract is generated, committed and served"
    statement: "Each API version has an OpenAPI contract generated from the code, committed to the repo and served by the API. Drift between them fails the build."
    rationale: "An API change should be visible in review as a contract diff."
    adr: ["0014"]
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_contracts.py::test_the_committed_contracts_match_the_code
      - 12_integration/tests/test_gateway.py::test_the_served_contract_is_the_committed_one

  - id: API-03
    domain: API
    title: "No breaking change within a major version"
    statement: "A change a client of the published contract could fail on requires a new major version. The CI gate compares a pull request's contract with the base branch."
    rationale: "Clients upgrade on their schedule, not the provider's."
    adr: ["0014"]
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_contracts.py::test_the_gate_fails_a_pr_that_breaks_v2
      - 12_integration/tests/test_contracts.py::test_the_checker_classifies_every_labeled_edit

  - id: API-04
    domain: API
    title: "Versions are deprecated in the open and retired on a date"
    statement: "A deprecated version says so in its contract and in Deprecation, Sunset and Link headers on every response, and returns 410 naming its successor after the sunset."
    rationale: "A client should learn of a retirement from the API, not from an outage."
    adr: ["0014"]
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_gateway.py::test_v1_is_served_with_its_deprecation_and_sunset
      - 12_integration/tests/test_gateway.py::test_after_its_sunset_v1_is_gone_and_says_where_to_go
      - 12_integration/tests/test_contracts.py::test_v1_is_marked_deprecated_in_its_contract

  - id: API-05
    domain: API
    title: "Errors are problem details, and hidden things look missing"
    statement: "Errors are application/problem+json. A resource the caller may not see gets the same answer as one that does not exist."
    rationale: "An error that differs for hidden resources reveals that they exist."
    adr: []
    applies_to: ["08", "12"]
    enforced_by:
      - 12_integration/tests/test_gateway.py::test_triage_status_follows_the_event_driven_run
      - 08_tools/tests/test_mcp_server.py::test_a_comment_on_an_issue_the_token_holder_cannot_see_is_refused

  # ---------------------------------------------------------------- Integration

  - id: INT-01
    domain: Integration
    title: "One envelope for every source"
    statement: "Events from every source are converted at the edge into one envelope with a source-unique id; consumers never parse a vendor's format."
    rationale: "Consumers then depend on one contract, not on every source."
    adr: ["0015"]
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_adapters.py::test_a_service_alert_is_already_event_shaped
      - 12_integration/tests/test_adapters.py::test_the_envelope_refuses_what_it_cannot_identify

  - id: INT-02
    domain: Integration
    title: "Handled exactly once, keyed on the business entity"
    statement: "Consumers assume at-least-once delivery. Duplicates are detected by event, and the work itself is keyed on the business entity, so two sources reporting one thing cause one action."
    rationale: "Broker deduplication works within a time window and per source; a business key has neither limit."
    adr: ["0010"]
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_delivery.py::test_duplicates_are_handled_once
      - 12_integration/tests/test_triage.py::test_one_outage_from_two_sources_is_triaged_once
      - 12_integration/tests/test_integration_check.py::test_keyed_on_events_two_sources_double_the_work_for_people_and_jira

  - id: INT-03
    domain: Integration
    title: "Writes to external systems are idempotent"
    statement: "A write to a system of record carries a key that lets a retry find its own earlier write, so a lost response never becomes a second write."
    rationale: "Retries are certain; duplicate writes are not acceptable."
    adr: ["0012"]
    applies_to: ["08", "12"]
    enforced_by:
      - 08_tools/tests/test_approval.py::test_a_lost_response_and_a_retry_still_post_once
      - 12_integration/tests/test_integration_check.py::test_without_the_marker_one_lost_response_posts_twice

  - id: INT-04
    domain: Integration
    title: "Retry what can recover; dead-letter what cannot"
    statement: "Invalid messages and policy halts go to the dead-letter queue at once with their reason; other failures retry with exponential backoff, then dead-letter. One bad message never blocks the rest, and a dead letter can be replayed once."
    rationale: "Retrying a message that cannot succeed only delays the ones behind it."
    adr: ["0015"]
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_delivery.py::test_a_message_that_keeps_failing_is_dead_lettered_and_the_rest_still_flow
      - 12_integration/tests/test_delivery.py::test_an_invalid_event_is_dead_lettered_at_once
      - 12_integration/tests/test_delivery.py::test_a_dead_letter_is_replayed_once_its_cause_is_fixed

  - id: INT-05
    domain: Integration
    title: "Batch files are checked against their control totals"
    statement: "A legacy batch file is accepted only when its header and trailer agree with its records; a bad record is rejected alone with its raw text and reason."
    rationale: "A truncated night looks like a quiet night."
    adr: []
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_adapters.py::test_a_truncated_file_is_rejected_whole
      - 12_integration/tests/test_adapters.py::test_a_bad_record_is_rejected_alone_and_the_rest_go_through

  - id: INT-06
    domain: Integration
    title: "Inbound webhooks are verified before they are read"
    statement: "A webhook's signature over the raw body is verified in constant time before the body is parsed."
    rationale: "Parsing an unverified body is already trusting it."
    adr: []
    applies_to: ["12"]
    enforced_by:
      - 12_integration/tests/test_adapters.py::test_an_unsigned_or_forged_webhook_is_refused
      - 12_integration/tests/test_adapters.py::test_a_body_changed_after_signing_is_refused
