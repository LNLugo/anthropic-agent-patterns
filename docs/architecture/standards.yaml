        - 15_document_control/tests/test_document_control.py::test_a_record_that_breaks_its_contract_is_quarantined_and_the_rest_flow

  - id: APP-05
    domain: Application
    title: "One way to choose a model"
    statement: "Modules get their model through llm_provider.get_chat_model, so the provider and model are one run setting."
    rationale: "Two selection paths drift: change the default in one and the other keeps the old one."
    adr: []
    applies_to: ["01", "02", "03", "04", "05", "06", "07", "08", "14"]
    evidence: {}
    checks: [model_construction]

  # ---------------------------------------------------------------- Observability and cost (AI operations)

  - id: APP-06
    domain: Application
    title: "Memory belongs to one identity, can be deleted, and expires"
    statement: "A session is bound to the identity that created it; opening another identity's session is refused. A user's history can be deleted, and expires after its retention period, deleted rather than hidden."
    rationale: "A session id is not a credential, and history kept forever is a liability, not a feature."
    adr: ["0016"]
    applies_to: ["09"]
    evidence:
      "09":
        - 09_memory/tests/test_session.py::test_a_sqlite_session_survives_a_restart_and_belongs_to_its_owner
        - 09_memory/tests/test_assistant_memory.py::test_someone_elses_session_is_refused_before_anything_runs
        - 09_memory/tests/test_session.py::test_expired_items_are_deleted_on_the_next_write_not_just_hidden
        - 09_memory/tests/test_session.py::test_pop_undoes_the_last_item_and_clear_deletes_everything
  - id: OPS-01
    domain: AI
    title: "Every run is traced, and content stays out by default"
    statement: "Every agent run is one trace with typed spans. Prompts, documents, model output and tool results are recorded only when explicitly enabled; metadata holds only identities, counts and values checked against a known format."
    rationale: "Traces are read by more people than the data they describe."
    adr: ["0007"]
    applies_to: ["06", "07", "08", "09", "12", "13", "14"]
    evidence:
      "06":
        - 10_observability/tests/test_leak_check.py::test_no_content_reaches_the_trace_file_and_the_control_sees_all_of_it
      "07":
        - 10_observability/tests/test_leak_check.py::test_no_content_reaches_the_trace_file_and_the_control_sees_all_of_it
      "08":
        - 10_observability/tests/test_leak_check.py::test_no_content_reaches_the_trace_file_and_the_control_sees_all_of_it
        - 08_tools/tests/test_guardrails.py::test_output_info_never_echoes_free_text_from_the_model
        - 08_tools/tests/test_traces.py::test_a_count_reconciles_span_for_span
      "09":
        - 09_memory/tests/test_assistant_memory.py::test_history_reaches_the_model_but_not_the_trace
        - 09_memory/tests/test_assistant_memory.py::test_the_trace_names_which_turns_the_model_saw_by_position_only
      "12":
        - 10_observability/tests/test_leak_check.py::test_no_content_reaches_the_trace_file_and_the_control_sees_all_of_it
      "13":
        - 13_paved_road/tests/test_paved_road.py::test_every_run_is_traced_with_content_off_and_spend_metered
        - 13_paved_road/tests/test_paved_road.py::test_unknown_or_contradictory_configuration_is_refused
      "14":
        - 14_knowledge_graph/tests/test_netgraph.py::test_retrieval_traces_counts_not_content

  - id: OPS-02
    domain: AI
    title: "Costs come from a sourced price file"
    statement: "Every price has a source and a date. A cost that includes an unpriced model is reported as unpriced, never as zero or a partial sum."
    rationale: "A wrong number that looks real is worse than a missing one."
    adr: ["0008"]
    applies_to: ["07", "08", "11", "13"]
    evidence:
      "07":
        - 11_finops/tests/test_cost_per_correct.py::test_rag_cost_per_correct_answer
      "08":
        - 11_finops/tests/test_cost_per_correct.py::test_the_price_file_reproduces_every_cost_recorded_in_08
      "11":
        - 11_finops/tests/test_prices_and_costing.py::test_a_model_missing_from_the_file_is_refused
        - 11_finops/tests/test_prices_and_costing.py::test_one_unpriced_call_makes_the_run_and_every_total_unpriced
      "13":
        - 13_paved_road/tests/test_paved_road.py::test_a_configuration_that_breaks_a_standard_is_a_build_error

  - id: OPS-03
    domain: AI
    title: "Model spend is held to a budget before the call"
    statement: "Every model call on behalf of an identity is checked against that identity's budget first, with a reserve for the call itself, so spend never passes the limit."
    rationale: "A budget reported after the fact is a bill, not a control."
    adr: ["0009"]
    applies_to: ["06", "07", "08", "12", "13"]
    evidence:
      "08":
        - 11_finops/tests/test_budget.py::test_a_daily_budget_stops_at_the_expected_question_and_calls_nothing_after
        - 11_finops/tests/test_budget.py::test_a_budget_stops_a_runaway_loop_mid_run
      "12":
        - 12_integration/tests/test_gateway.py::test_the_model_route_is_held_to_the_callers_budget

  # ---------------------------------------------------------------- API
      "13":
        - 13_paved_road/tests/test_paved_road.py::test_the_budget_is_checked_before_the_model_is_called

  - id: API-01
    domain: API
    title: "Every external interface is behind the gateway"
    statement: "Clients reach agents through one gateway that applies identity, scopes, rate limits, the contract and budgets in a fixed order."
    rationale: "One policy point is one place to audit and change."
    adr: []
    applies_to: ["08", "12"]
    evidence:
      "12":
        - 12_integration/tests/test_gateway.py::test_no_token_no_entry
        - 12_integration/tests/test_gateway.py::test_a_route_needs_its_scope
        - 12_integration/tests/test_gateway.py::test_a_burst_is_limited_per_subject_and_recovers

  - id: API-02
    domain: API
    title: "The contract is generated, committed and served"
    statement: "Each API version has an OpenAPI contract generated from the code, committed to the repo and served by the API. Drift between them fails the build."
    rationale: "An API change should be visible in review as a contract diff."
    adr: ["0014"]
    applies_to: ["12"]
    evidence:
      "12":
        - 12_integration/tests/test_contracts.py::test_the_committed_contracts_match_the_code
        - 12_integration/tests/test_gateway.py::test_the_served_contract_is_the_committed_one

  - id: API-03
    domain: API
    title: "No breaking change within a major version"
    statement: "A change a client of the published contract could fail on requires a new major version. The CI gate compares a pull request's contract with the base branch."
    rationale: "Clients upgrade on their schedule, not the provider's."
    adr: ["0014"]
    applies_to: ["12"]
    evidence:
      "12":
        - 12_integration/tests/test_contracts.py::test_the_gate_fails_a_pr_that_breaks_v2
        - 12_integration/tests/test_contracts.py::test_the_checker_classifies_every_labeled_edit

  - id: API-04
    domain: API
    title: "Versions are deprecated in the open and retired on a date"
    statement: "A deprecated version says so in its contract and in Deprecation, Sunset and Link headers on every response, and returns 410 naming its successor after the sunset."
    rationale: "A client should learn of a retirement from the API, not from an outage."
    adr: ["0014"]
    applies_to: ["12"]
    evidence:
      "12":
        - 12_integration/tests/test_gateway.py::test_v1_is_served_with_its_deprecation_and_sunset
        - 12_integration/tests/test_gateway.py::test_after_its_sunset_v1_is_gone_and_says_where_to_go
        - 12_integration/tests/test_contracts.py::test_v1_is_marked_deprecated_in_its_contract

  - id: API-05
    domain: API
    title: "Errors are problem details, and hidden things look missing"
    statement: "Errors are application/problem+json. A resource the caller may not see gets the same answer as one that does not exist."
    rationale: "An error that differs for hidden resources reveals that they exist."
    adr: []
    applies_to: ["08", "12"]
    evidence:
      "08":
        - 08_tools/tests/test_mcp_server.py::test_a_comment_on_an_issue_the_token_holder_cannot_see_is_refused
      "12":
        - 12_integration/tests/test_gateway.py::test_triage_status_follows_the_event_driven_run

  # ---------------------------------------------------------------- Integration

  - id: INT-01
    domain: Integration
    title: "One envelope for every source"
    statement: "Events from every source are converted at the edge into one envelope with a source-unique id; consumers never parse a vendor's format."
    rationale: "Consumers then depend on one contract, not on every source."
    adr: ["0015"]
    applies_to: ["12", "15"]
    evidence:
      "12":
        - 12_integration/tests/test_adapters.py::test_a_service_alert_is_already_event_shaped
        - 12_integration/tests/test_adapters.py::test_the_envelope_refuses_what_it_cannot_identify
      "15":
        - 15_document_control/tests/test_document_control.py::test_every_source_record_becomes_one_envelope_or_a_named_rejection

  - id: INT-02
    domain: Integration
    title: "Handled exactly once, keyed on the business entity"
    statement: "Consumers assume at-least-once delivery. Duplicates are detected by event, and the work itself is keyed on the business entity, so two sources reporting one thing cause one action."
    rationale: "Broker deduplication works within a time window and per source; a business key has neither limit."
    adr: ["0010"]
    applies_to: ["12", "15"]
    evidence:
      "12":
        - 12_integration/tests/test_delivery.py::test_duplicates_are_handled_once
        - 12_integration/tests/test_triage.py::test_one_outage_from_two_sources_is_triaged_once
        - 12_integration/tests/test_integration_check.py::test_keyed_on_events_two_sources_double_the_work_for_people_and_jira
      "15":
        - 15_document_control/tests/test_document_control.py::test_shuffled_duplicated_and_crashed_delivery_reaches_the_same_outcome
        - 15_document_control/tests/test_document_control.py::test_without_the_processed_store_the_work_repeats_but_the_outcome_holds
        - 15_document_control/tests/test_document_control.py::test_copies_in_a_second_system_are_one_record_conflicts_are_kept_apart

  - id: INT-03
    domain: Integration
    title: "Writes to external systems are idempotent"
    statement: "A write to a system of record carries a key that lets a retry find its own earlier write, so a lost response never becomes a second write."
    rationale: "Retries are certain; duplicate writes are not acceptable."
    adr: ["0012"]
    applies_to: ["08", "12"]
    evidence:
      "08":
        - 08_tools/tests/test_approval.py::test_a_lost_response_and_a_retry_still_post_once
      "12":
        - 12_integration/tests/test_integration_check.py::test_without_the_marker_one_lost_response_posts_twice

  - id: INT-04
    domain: Integration
    title: "Retry what can recover; dead-letter what cannot"
    statement: "Invalid messages and policy halts go to the dead-letter queue at once with their reason; other failures retry with exponential backoff, then dead-letter. One bad message never blocks the rest, and a dead letter can be replayed once."
    rationale: "Retrying a message that cannot succeed only delays the ones behind it."
    adr: ["0015"]
    applies_to: ["12", "15"]
    evidence:
      "12":
        - 12_integration/tests/test_delivery.py::test_a_message_that_keeps_failing_is_dead_lettered_and_the_rest_still_flow
        - 12_integration/tests/test_delivery.py::test_an_invalid_event_is_dead_lettered_at_once
        - 12_integration/tests/test_delivery.py::test_a_dead_letter_is_replayed_once_its_cause_is_fixed
      "15":
        - 15_document_control/tests/test_document_control.py::test_a_record_that_breaks_its_contract_is_quarantined_and_the_rest_flow
        - 15_document_control/tests/test_document_control.py::test_a_file_that_will_not_parse_is_quarantined_with_its_reason

  - id: INT-05
    domain: Integration
    title: "Batch files are checked against their control totals"
    statement: "A legacy batch file is accepted only when its header and trailer agree with its records; a bad record is rejected alone with its raw text and reason."
    rationale: "A truncated night looks like a quiet night."
    adr: []
    applies_to: ["12"]
    evidence:
      "12":
        - 12_integration/tests/test_adapters.py::test_a_truncated_file_is_rejected_whole
        - 12_integration/tests/test_adapters.py::test_a_bad_record_is_rejected_alone_and_the_rest_go_through

  - id: INT-06
    domain: Integration
    title: "Inbound webhooks are verified before they are read"
    statement: "A webhook's signature over the raw body is verified in constant time before the body is parsed."
    rationale: "Parsing an unverified body is already trusting it."
    adr: []
    applies_to: ["12"]
    evidence:
      "12":
        - 12_integration/tests/test_adapters.py::test_an_unsigned_or_forged_webhook_is_refused
        - 12_integration/tests/test_adapters.py::test_a_body_changed_after_signing_is_refused

  # ---------------------------------------------------------------- Enablement

  - id: ENB-01
    domain: Enablement
    title: "A new use case takes the paved road"
    statement: "A new agent use case is a folder of configuration, prompts and a golden set, built by paved_road.build from the platform modules. It does not copy platform code, and no use case's project or space names appear in shared code."
    rationale: "A copy forks the controls: the next fix to a guardrail reaches the original and not the copy."
    adr: ["0017"]
    applies_to: ["13"]
    evidence:
      "13":
        - 13_paved_road/tests/test_paved_road.py::test_no_project_code_appears_in_shared_code
        - 13_paved_road/tests/test_paved_road.py::test_the_static_check_sees_a_planted_code
        - 13_paved_road/tests/test_paved_road.py::test_a_scaffolded_use_case_is_green_before_it_is_edited

  - id: ENB-02
    domain: Enablement
    title: "A use case merges only when its golden set passes offline"
    statement: "Every use case has a golden set covering an answer, a permission difference, a refusal, a halt and a clarifying question. The offline gate replays it through the real pipeline on every pull request and blocks the merge below the threshold (100% by default). The live gate measures the model's choices and reports."
    rationale: "A gate that needs a key or varies from run to run gets switched off; one that is deterministic can be required."
    adr: ["0017"]
    applies_to: ["13"]
    evidence:
      "13":
        - 13_paved_road/tests/test_paved_road.py::test_both_use_cases_pass_the_offline_gate
        - 13_paved_road/tests/test_paved_road.py::test_the_gate_fails_a_wrong_expectation
        - 13_paved_road/tests/test_paved_road.py::test_the_gate_catches_a_regression_in_shared_code
        - 13_paved_road/tests/test_paved_road.py::test_the_gate_script_exits_nonzero_below_the_threshold
        - 13_paved_road/tests/test_paved_road.py::test_live_mode_scores_the_models_choice_and_does_not_block
