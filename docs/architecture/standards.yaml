# Architecture standards. The source of truth: standards.md is rendered from this
# file (python docs/architecture/render_standards.py), and a test fails if it is stale.
#
# applies_to lists the modules a standard governs. For each of them, conformance
# (conformance.py) needs one of:
#   evidence  tests that enforce the standard for that module, as path::test, keyed by
#             module (a test in one module can be evidence for another: 10's leak check
#             covers 06, 07 and 08). A test checks that each one exists.
#   checks    static checks run over the module's code (conformance.py)
#   an exception in exceptions.yaml, with an owner and an expiry
# A standard with neither evidence nor checks is enforced by design review only, and
# is counted as attested, not as conforming. Anything else is a gap, and CI fails on it.

standards:

  # ---------------------------------------------------------------- AI

  - id: AI-01
    domain: AI
    title: "The simplest pattern that reliably works"
    statement: "Start with the least autonomous pattern that solves the problem, and add a model or a loop only when a measurement shows the simpler one falls short."
    rationale: "Every added step is cost and a way to be wrong. The repo's routing, triage and evaluations are each justified by a number."
    adr: ["0001", "0011"]
    applies_to: ["06", "08", "12"]
    evidence: {}

  - id: AI-02
    domain: AI
    title: "A model never writes queries"
    statement: "A model produces typed, validated arguments; the tool builds the query. No free text from a model reaches a query language."
    rationale: "Typed arguments leave nothing to inject into."
    adr: ["0002"]
    applies_to: ["08"]
    evidence:
      "08":
        - 08_tools/tests/test_jql_tool.py::test_injection_through_a_field_is_rejected
        - 08_tools/tests/test_jql_tool.py::test_raw_jql_argument_cannot_pass_through
        - 08_tools/tests/test_jql_tool.py::test_jql_is_built_by_the_tool

  - id: AI-03
    domain: AI
    title: "Every run ends in a typed outcome"
    statement: "An agent turn ends in exactly one typed outcome, and a run always states why it ended. A reply outside the allowed set stops the run; it is never guessed at."
    rationale: "An agent that cannot say why it stopped cannot be audited or debugged."
    adr: []
    applies_to: ["06", "08"]
    evidence:
      "06":
        - 06_agents/test_agents_06_v3_1.py::test_anything_else_is_an_interruption_not_a_guess
        - 06_agents/test_agents_06_v3_1.py::test_every_run_ends_with_a_status
      "08":
        - 08_tools/tests/test_assistant_model_router.py::test_a_reply_with_no_tool_call_is_not_guessed_at

  - id: AI-04
    domain: AI
    title: "Answers are grounded or withheld"
    statement: "An answer ships only with evidence that resolves to what the model was shown (a citation, or the words that named the query's scope); otherwise the system abstains or asks."
    rationale: "A confident wrong answer is the expensive failure."
    adr: []
    applies_to: ["07", "08", "14"]
    evidence:
      "07":
        - 07_rag/tests/test_citations_and_graph.py::test_graph_abstains_when_citation_is_fabricated
      "08":
        - 08_tools/tests/test_assistant_model_router.py::test_the_coverage_check_stops_a_half_answer_in_the_main_path
        - 08_tools/tests/test_assistant.py::test_missing_project_asks_a_question_and_runs_nothing
      "14":
        - 14_knowledge_graph/tests/test_netgraph.py::test_a_grounded_answer_cites_only_what_it_was_shown
        - 14_knowledge_graph/tests/test_netgraph.py::test_no_evidence_means_no_model_call

  - id: AI-05
    domain: AI
    title: "Guardrails return one of three behaviours, in a defined order"
    statement: "A tool guardrail allows, rejects with a message the model can act on, or halts the run. Security checks run first and halt; deployment policy coaches."
    rationale: "A security event must not be politely redirected into a retry."
    adr: ["0004"]
    applies_to: ["08", "12", "13"]
    evidence:
      "08":
        - 08_tools/tests/test_guardrails.py::test_order_matters_restricted_halts_before_scope_could_redirect
        - 08_tools/tests/test_assistant_model_router.py::test_raise_exception_halts_the_graph_even_for_a_call_the_bound_refuses
      "12":
        - 12_integration/tests/test_triage.py::test_an_event_cannot_point_the_service_at_a_restricted_project
      "13":
        - 13_paved_road/tests/test_paved_road.py::test_a_configuration_that_breaks_a_standard_is_a_build_error
        - 13_paved_road/tests/test_paved_road.py::test_the_policy_is_built_over_the_use_cases_catalog

  - id: AI-06
    domain: AI
    title: "A write waits for a person who is not the requester"
    statement: "Any action that changes data pauses for approval, survives a restart while waiting, and cannot be approved by the identity that asked for it. No agent-facing interface can approve."
    rationale: "Accountability for a change belongs to a person."
    adr: ["0005"]
    applies_to: ["08", "12", "13"]
    evidence:
      "08":
        - 08_tools/tests/test_approval.py::test_the_requester_cannot_approve_their_own_write
        - 08_tools/tests/test_approval.py::test_resume_from_a_saved_checkpoint_after_a_restart
        - 08_tools/tests/test_mcp_server.py::test_a_comment_over_mcp_waits_for_a_person_and_there_is_no_approve_tool
      "12":
        - 12_integration/tests/test_triage.py::test_the_service_cannot_approve_itself_and_a_person_posts_it_once
      "13":
        - 13_paved_road/tests/test_paved_road.py::test_a_configuration_that_breaks_a_standard_is_a_build_error
        - 13_paved_road/tests/test_paved_road.py::test_an_approval_waits_across_a_restart

  - id: AI-07
    domain: AI
    title: "Measured on questions nobody tuned for"
    statement: "A model-dependent component is measured on a held-out set written without seeing the prompt, over more than one run, against a non-model baseline."
    rationale: "A score on the development set measures the prompt's fit to it."
    adr: ["0001", "0013", "0018"]
    applies_to: ["07", "08", "14"]
    evidence:
      "08":
        - 08_tools/tests/test_model_router.py::test_template_placeholders_are_refused
        - 11_finops/tests/test_cost_per_correct.py::test_rules_are_free_but_each_extra_correct_route_has_a_price

  # ---------------------------------------------------------------- Security and identity (application)
      "14":
        - 14_knowledge_graph/tests/test_netgraph.py::test_held_out_3_was_scored_by_the_retriever_as_it_is_now
        - 14_knowledge_graph/tests/test_netgraph.py::test_the_published_numbers_are_what_the_code_produces_now

  - id: AI-08
    domain: AI
    title: "Memory is selected, bounded, and never widens a check"
    statement: "What a model sees from past turns is chosen by relevance within a bound, with the user's standing instructions pinned. Nothing from memory counts as evidence for a check except the user's own pinned instructions."
    rationale: "Appending everything grows cost without limit; a summary forgets; and a project named in passing earlier must not authorize a query now."
    adr: ["0016"]
    applies_to: ["09"]
    evidence:
      "09":
        - 09_memory/tests/test_strategies.py::test_retrieval_with_pins_recalls_most_at_a_fraction_of_the_cost
        - 09_memory/tests/test_strategies.py::test_pinning_is_what_keeps_the_standing_instruction
        - 09_memory/tests/test_assistant_memory.py::test_a_project_named_earlier_is_not_evidence_for_a_new_question
  - id: APP-01
    domain: Application
    title: "Every call is made as a named identity"
    statement: "Every call to a system of record names the user it acts for, or a service identity for work no person started. Permissions are the system's own, never replicated into the agent."
    rationale: "Delegated permissions cannot drift; a replicated copy can."
    adr: ["0003", "0012"]
    applies_to: ["07", "08", "12", "14"]
    evidence:
      "07":
        - 07_rag/tests/test_permissions.py::test_zero_leakage_with_filter
      "08":
        - 08_tools/tests/test_jql_tool.py::test_jira_refuses_calls_without_a_named_user
        - 08_tools/tests/test_jql_tool.py::test_count_depends_on_who_asks
      "12":
        - 12_integration/tests/test_gateway.py::test_jira_permissions_still_apply_through_the_gateway
      "14":
        - 14_knowledge_graph/tests/test_netgraph.py::test_no_retriever_ever_returns_what_the_asker_may_not_read
        - 14_knowledge_graph/tests/test_netgraph.py::test_a_path_goes_only_through_what_the_asker_may_read

  - id: APP-02
    domain: Application
    title: "Identity comes from the credential, never from the arguments"
    statement: "Who is asking is taken from a verified token. No tool or route accepts a user, caller or group argument."
    rationale: "An agent that can name the user can name any user."
    adr: ["0006"]
    applies_to: ["08", "12"]
    evidence:
      "08":
        - 08_tools/tests/test_mcp_server.py::test_no_tool_takes_a_user_argument
        - 08_tools/tests/test_mcp_server.py::test_naming_another_user_in_the_arguments_changes_nothing
      "12":
        - 12_integration/tests/test_gateway.py::test_the_contract_refuses_a_request_before_any_agent_runs

  - id: APP-03
    domain: Application
    title: "Fail closed"
    statement: "Unknown permissions, missing ancestors, unpriced models and unverifiable inputs are refused, not defaulted to open."
    rationale: "Every default-open path is a leak waiting for its input."
    adr: ["0008"]
    applies_to: ["07", "11", "12", "14", "15"]
    evidence:
      "07":
        - 07_rag/tests/test_permissions.py::test_unknown_space_fails_closed
        - 07_rag/tests/test_permissions.py::test_chunk_without_gates_is_never_returned
      "11":
        - 11_finops/tests/test_budget.py::test_an_unpriced_model_is_refused_before_it_is_called
      "12":
        - 12_integration/tests/test_adapters.py::test_an_unsigned_or_forged_webhook_is_refused
      "14":
        - 14_knowledge_graph/tests/test_netgraph.py::test_the_vector_filter_is_built_from_checked_group_names
        - 14_knowledge_graph/tests/test_netgraph.py::test_an_index_made_for_another_model_is_refused_before_indexing
        - 14_knowledge_graph/tests/test_netgraph.py::test_someone_in_no_group_gets_nothing
      "15":
