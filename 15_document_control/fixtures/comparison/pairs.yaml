standard:
  id: STD-QA-001
  title: Document control standard (invented)
  clauses:
  - id: STD-1
    requirement: The procedure states its purpose.
    heading: Purpose
  - id: STD-2
    requirement: The procedure defines its scope.
    heading: Scope
  - id: STD-3
    requirement: The procedure names who is responsible.
    heading: Responsibilities
  - id: STD-4
    requirement: The procedure states how long records are kept.
    heading: Records
    words:
    - kept for
  - id: STD-5
    requirement: The procedure carries a revision history.
    heading: Revision history
  - id: STD-6
    requirement: The procedure names who approved it.
    header: Approved by
