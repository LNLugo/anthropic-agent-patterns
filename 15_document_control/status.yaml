# What stands in for each managed service in the parts built so far (ADR 0015).
stand_ins:
  - {service: Azure AI Document Intelligence (read and layout), stand_in: "pypdf for native PDFs; a layout-result JSON (lines with confidence, tables as cells) for scans"}
  - {service: Event Grid and Event Hubs, stand_in: "12's envelope and in-process broker, plus an append-only event log for replay"}
  - {service: Azure Blob Storage or ADLS Gen2 (landing), stand_in: "fixtures/sources/*/files and an in-memory blob store for attachments"}
  - {service: Azure AI Language PII detection, stand_in: "rules for the forms the sources use (docctl/pii.py)"}
  - {service: Databricks Delta tables over SAP master data, stand_in: "fixtures/master/*.csv"}
  - {service: Azure OpenAI (classification, extraction), stand_in: "llm_provider; scripted in tests, plumbing only"}
  - {service: Azure OpenAI embeddings, stand_in: "llm_provider's HashingEmbeddings: a lexical stand-in, so vector results are a word-matching baseline"}
  - {service: Azure AI Search (BM25, HNSW vectors, filters), stand_in: "docctl/index.py: exact search over every row, BM25 from rank_bm25, the same filters"}
  - {service: Semantic ranker or hosted cross-encoder, stand_in: "none: section collapse only (07's cross-encoder needs a model download)"}
  - {service: Immutable storage for audit records, stand_in: "a hash-chained, append-only log in memory (docctl/review.py)"}
  - {service: The source DMS's decision API, stand_in: "MockDMS: stores decisions by request id, and can lose a response on purpose"}
  - {service: "Azure AI Content Safety, Prompt Shields", stand_in: "rules: instruction-like text flagged at ingest, release and approval decisions refused, output scanned for personal data"}
  - {service: Azure OpenAI (answers), stand_in: "llm_provider; ScriptedChatModel in tests, so answer quality is not measured"}
