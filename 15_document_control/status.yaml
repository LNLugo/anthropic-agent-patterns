    note: "HashingEmbeddings stands in for text-embedding-3-large at 1,024 dimensions; the candidate model compared is a second stand-in. Title and summary vectors are not built: no gain has been measured to justify them."
  - section: 8
    title: "Indexing, ANN and sizing"
    status: Built as in-process stand-in
    pr: 2
