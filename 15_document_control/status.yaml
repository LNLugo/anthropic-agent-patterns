# Build status of docs/designs/smartdms.md, one row per section. The module README's status
# table and the app's "Build status" tab are both rendered from this file, and a test checks
# that every file and test named here exists.
#
# status: Built | Built as in-process stand-in | Documented only | Planned
statuses: [Built, Built as in-process stand-in, Documented only, Planned]
sections:
