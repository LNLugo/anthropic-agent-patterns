            tests/test_retrieval.py::test_personal_data_in_the_output_is_redacted]
    note: "Rules stand in for Content Safety and Prompt Shields. Attribution is citation validity (07's validator), not a model judging support."
  - section: 13
    title: Human in the loop and audit trail
    status: Built
    pr: 3
    proof: [docctl/review.py, tests/test_compare_review.py::test_high_risk_documents_always_go_to_a_person_and_some_automatic_approvals_are_sampled,
            tests/test_compare_review.py::test_a_review_waits_for_a_person_across_a_restart,
            tests/test_compare_review.py::test_the_service_and_the_requester_cannot_approve_their_own_output,
            tests/test_compare_review.py::test_an_edit_becomes_a_gold_example_with_the_reviewers_label,
            tests/test_compare_review.py::test_the_audit_chain_shows_where_a_record_was_changed]
    note: "Approval is ADR 0005's mechanism (a LangGraph interrupt on a SQLite checkpoint) in a graph of its own: 08's is built into its Jira assistant. Not built: a workbench where a person edits values in place, and lineage in Unity Catalog."
  - section: 14
    title: Caching and freshness
    status: Built
    pr: 2
    proof: [docctl/cache.py, tests/test_retrieval.py::test_people_with_different_access_never_share_a_cached_answer,
