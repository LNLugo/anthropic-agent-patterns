    note: "Routing is rules: every development question routes correctly, so 08's model router is not needed yet. Prompt registration in MLflow is not built."
  - section: 12
    title: Hallucination mitigation and safety
    status: Built as in-process stand-in
    pr: 2
    proof: [tests/test_retrieval.py::test_a_sentence_citing_something_it_was_not_shown_is_removed,
            tests/test_retrieval.py::test_an_answer_mostly_unsupported_becomes_an_abstention,
            tests/test_retrieval.py::test_instructions_inside_a_supplier_document_never_trigger_a_tool,
