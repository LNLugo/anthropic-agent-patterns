# Build status of docs/designs/smartdms.md, one row per section. The module README's status
# table and the app's "Build status" tab are both rendered from this file, and a test checks
# that every file and test named here exists.
#
# status: Built | Built as in-process stand-in | Documented only | Planned
statuses: [Built, Built as in-process stand-in, Documented only, Planned]
sections:
  - section: 1
    title: Planning assumptions
    status: Built
    pr: 1
    proof: [assumptions.yaml, tests/test_document_control.py::test_the_assumptions_are_the_designs]
    note: The inputs only. sizing.py, which derives every sizing and cost figure from them, is PR 4.
  - section: 2
    title: Requirements and service levels
    status: Planned
    pr: 4
  - section: 3
    title: Architecture overview
    status: Planned
    pr: 4
    note: The stand-in map below covers the parts built so far.
  - section: 4
    title: Document lifecycle and system of record
    status: Built
    pr: 1
    proof: [docctl/lifecycle.py, docctl/identity.py,
            tests/test_document_control.py::test_never_two_effective_revisions_at_any_step_in_any_order,
            tests/test_document_control.py::test_illegal_transitions_are_quarantined_not_applied,
            tests/test_document_control.py::test_the_system_of_records_copy_is_canonical_whatever_arrives_first,
            tests/test_compare_review.py::test_a_lost_response_writes_the_decision_once_and_the_control_writes_it_twice]
    note: "Review decisions are written back to the DMS through its API with a request id, so a retry after a lost response writes once (PR 3)."
  - section: 5
    title: Ingestion, parsing and chunking
    status: Built as in-process stand-in
    pr: 1
    proof: [docctl/contracts.py, docctl/eventlog.py, docctl/parse.py, docctl/chunking.py, docctl/pii.py,
            tests/test_document_control.py::test_a_record_that_breaks_its_contract_is_quarantined_and_the_rest_flow,
            tests/test_document_control.py::test_shuffled_duplicated_and_crashed_delivery_reaches_the_same_outcome,
            tests/test_document_control.py::test_an_unchanged_section_is_not_embedded_again,
            tests/test_document_control.py::test_personal_data_is_redacted_and_approvers_are_kept]
    note: OCR is a layout-result stand-in; PII detection is rules; Event Hubs is an append-only log.
  - section: 6
    title: Classification, extraction and validation
    status: Built
    pr: 1
    proof: [taxonomy.yaml, docctl/classify.py, docctl/extract.py, docctl/validate.py,
            tests/test_document_control.py::test_no_document_is_filed_as_the_wrong_type,
            tests/test_document_control.py::test_every_planted_validation_failure_goes_to_review,
            tests/test_document_control.py::test_nothing_is_silently_corrected]
    note: "Rules make every decision. The model path is built and tested as plumbing; its quality is not claimed. Not built: cited summaries per document type (purpose, scope, key requirements, changes since the last revision)."
  - section: 7
    title: Embeddings
    status: Built as in-process stand-in
    pr: 2
    proof: [docctl/index.py, tests/test_retrieval.py::test_every_vector_names_its_model_and_a_query_from_another_model_is_refused,
            tests/test_retrieval.py::test_a_new_index_replaces_the_old_only_if_it_does_as_well_and_can_be_rolled_back]
    note: "HashingEmbeddings stands in for text-embedding-3-large at 1,024 dimensions; the candidate model compared is a second stand-in. Title and summary vectors are not built: no gain has been measured to justify them."
  - section: 8
    title: "Indexing, ANN and sizing"
    status: Built as in-process stand-in
    pr: 2
    proof: [docctl/index.py, tests/test_retrieval.py::test_queries_keep_using_the_old_index_until_the_flip,
            tests/test_retrieval.py::test_a_new_effective_revision_replaces_the_old_in_one_write]
    note: "Search is exact over every row. HNSW, int8 quantization and rescoring are the design's parameters (s8), not exercised here. Sizing is PR 4."
  - section: 9
    title: Retrieval and reranking
    status: Built as in-process stand-in
    pr: 2
    proof: [docctl/retrieve.py, tests/test_retrieval.py::test_no_default_query_returns_a_superseded_revision_and_the_control_does,
            tests/test_retrieval.py::test_no_one_is_shown_a_document_they_may_not_open_and_the_control_sees_them,
            tests/test_retrieval.py::test_a_named_document_short_circuits_to_that_document_only,
            tests/test_retrieval.py::test_the_answerability_threshold_is_the_calibrated_midpoint]
    note: "07's fusion over BM25 and vectors. Not built: a reranker (07's needs a model download), conversation rewriting, language detection."
  - section: 10
    title: Comparison engine
    status: Built
    pr: 3
    proof: [docctl/compare.py, docctl/conformance_checks.py, docctl/headline.py,
            tests/test_compare_review.py::test_the_diff_finds_every_planted_change_and_nothing_else,
            tests/test_compare_review.py::test_rewrapped_text_extra_spaces_and_a_moved_page_break_are_not_changes,
            tests/test_compare_review.py::test_out_of_specification_results_are_caught_and_nothing_else_is,
            tests/test_compare_review.py::test_each_planted_break_of_the_standard_is_found_and_none_is_passed,
            tests/test_compare_review.py::test_a_recording_replays_to_the_same_scores,
            tests/test_compare_review.py::test_the_recorded_live_runs_replay_to_the_reported_scores]
    note: "All three modes. The headline result's model arms ran live three times: both found 51 of 51, so neither of ADR 0019's rules fired. The test revisions are a paragraph long; ADR 0019 stays Proposed until pairs of realistic length are measured (PR 4a)."
  - section: 11
    title: Prompt orchestration
    status: Built
    pr: 2
    proof: [docctl/assistant.py, tests/test_retrieval.py::test_every_development_question_is_routed_by_rules,
            tests/test_retrieval.py::test_the_context_is_packed_labelled_and_within_budget,
