    title: Document lifecycle and system of record
    status: Built
    pr: 1
    proof: [docctl/lifecycle.py, docctl/identity.py,
            tests/test_document_control.py::test_never_two_effective_revisions_at_any_step_in_any_order,
            tests/test_document_control.py::test_illegal_transitions_are_quarantined_not_applied,
            tests/test_document_control.py::test_the_system_of_records_copy_is_canonical_whatever_arrives_first]
    note: Write-back of review decisions to the DMS moves to PR 3, where the decisions exist.
  - section: 5
    title: Ingestion, parsing and chunking
    status: Built as in-process stand-in
    pr: 1
    proof: [docctl/contracts.py, docctl/eventlog.py, docctl/parse.py, docctl/chunking.py, docctl/pii.py,
            tests/test_document_control.py::test_a_record_that_breaks_its_contract_is_quarantined_and_the_rest_flow,
            tests/test_document_control.py::test_shuffled_duplicated_and_crashed_delivery_reaches_the_same_outcome,
            tests/test_document_control.py::test_an_unchanged_section_is_not_embedded_again,
            tests/test_document_control.py::test_personal_data_is_redacted_and_approvers_are_kept]
    note: OCR is a layout-result stand-in; PII detection is rules; Event Hubs is an append-only log.
  - section: 6
    title: Classification, extraction and validation
    status: Built
    pr: 1
    proof: [taxonomy.yaml, docctl/classify.py, docctl/extract.py, docctl/validate.py,
            tests/test_document_control.py::test_no_document_is_filed_as_the_wrong_type,
            tests/test_document_control.py::test_every_planted_validation_failure_goes_to_review,
            tests/test_document_control.py::test_nothing_is_silently_corrected]
    note: Rules make every decision. The model path is built and tested as plumbing; its quality is not claimed.
