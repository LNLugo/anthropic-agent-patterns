name: tests

# Every suite runs offline: Phase 1 on the scripted model, 07 and 08 on fixtures.
# No API keys are configured, so a test that tried to reach a live model would fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        suite: [phase1, 07_rag, 08_tools, 09_memory, 10_observability, 11_finops, 12_integration]
        include:
          - suite: phase1
            dir: .
            requirements: requirements.txt
          - suite: 07_rag
            dir: 07_rag
            requirements: 07_rag/requirements-test.txt
          - suite: 08_tools
            dir: 08_tools
            requirements: 08_tools/requirements.txt
          - suite: 09_memory
            dir: 09_memory
            requirements: 09_memory/requirements-test.txt
          - suite: 10_observability
            dir: 10_observability
            requirements: 10_observability/requirements-test.txt
          - suite: 11_finops
            dir: 11_finops
            requirements: 11_finops/requirements-test.txt
          - suite: 12_integration
            dir: 12_integration
            requirements: 12_integration/requirements-test.txt
    env:
      LLM_PROVIDER: scripted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install
        run: python -m pip install -r ${{ matrix.requirements }}

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: python -m pytest -q

      # The API lifecycle gate: a pull request may not break the v2 contract main publishes.
      - name: Contract gate
        if: matrix.suite == '12_integration' && github.event_name == 'pull_request'
        working-directory: 12_integration
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:12_integration/contracts/openapi-v2.json > "$RUNNER_TEMP/base-v2.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-v2.json"
          python run_contract_check.py --baseline-v2 "$RUNNER_TEMP/base-v2.json"
