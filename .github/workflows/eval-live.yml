name: live evaluation

# The configured model chooses each golden case's call. Reports; never blocks a merge.
# Needs the OPENAI_API_KEY repository secret. Without it the run says so and stops.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # nightly

permissions:
  contents: read

jobs:
  live:
    name: Live gate (reports)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 13_paved_road/requirements-test.txt
      - name: Check for the key
        id: key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY is not set; the live gate did not run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: python -m pip install -r 13_paved_road/requirements-test.txt
      - name: Live gate, every use case
        if: steps.key.outputs.present == 'true'
        working-directory: 13_paved_road
        run: python run_gate.py --mode live --report "$RUNNER_TEMP/live.json"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: live-gate-report
          path: ${{ runner.temp }}/live.json
